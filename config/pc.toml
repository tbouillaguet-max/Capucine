# --- CalculRisque_Mark5, piloté de bout en bout -----------------------------
#
# « projet » lance N'IMPORTE QUEL projet ; « calculrisque » en sait davantage
# sur CELUI-LÀ : ses enchaînements nommés, ses cinq optimiseurs, et la forme
# exacte d'une stratégie dans son registre. Décommentez, ajustez le chemin.
#
# Le dossier doit être ouvert dans l'atelier, sinon toutes ces compétences
# refusent — elles lancent des programmes et écrivent des fichiers.
#
# [plugins.calculrisque]
# chemin = "~/projets/CalculRisque_Mark5"
# delai_s = 21600                       # six heures : une optimisation en prend plusieurs
# strategie_par_defaut = "valuation_gap_options"
# variables = { SEC_CONTACT_EMAIL = "vous@exemple.fr", MISTRAL_API_KEY = "…" }
#
# Les enchaînements : une liste de commandes, jouées dans l'ordre, arrêtées à
# la première qui échoue. Ce sont des DONNÉES — en ajouter un ne demande pas
# de toucher au plugin.
#
# [plugins.calculrisque.enchainements]
# quotidienne = ["03b_recuperation_cours_quotidiens.py"]
# trimestrielle = ["run_pipeline_quarterly.py --resume"]
