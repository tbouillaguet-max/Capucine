# Profil Raspberry Pi / mini-PC Linux : le même code, une autre configuration.

[llm]
engine = "ollama"
model = "qwen2.5:3b-instruct-q4_K_M"
num_ctx = 2048

[llm.router]
# Sur Pi, chaque appel au modèle coûte cher : on fait davantage confiance à
# l'étage déterministe, quitte à être un peu plus permissif.
direct_threshold = 0.65

[stt]
# Sur Pi, « base » reste tenable ; passez à « vosk » si la latence dépasse
# la seconde et demie.
model = "base"
device = "cpu"
compute_type = "int8"
beam_size = 1               # le faisceau coûte cher et n'apporte presque rien ici

[tts]
voice = "fr_FR-siwis-medium"

[plugins]
timeout = 15.0

[audio]
frame_ms = 30

[wake]
# Sur Pi, Vosk d'emblée : il consomme peu et tourne en continu sans peine.
engine = "vosk"

[vad]
engine = "silero"           # onnxruntime seulement, torch n'est jamais requis

[barge_in]
# Un Pi est souvent branché sur un haut-parleur ouvert : n'interrompre que sur
# le mot d'éveil évite qu'il se coupe lui-même.
mode = "eveil"
