# Configuration de référence de Lily.
# Elle est chargée en premier, puis surchargée par le profil (pc.toml ou
# pi.toml), puis par les variables d'environnement LILY_SECTION__CLE,
# puis par les options de ligne de commande.

language = "fr"

[assistant]
name = "Lily"
persona_file = "config/persona.txt"
memory_turns = 6            # nombre de tours conservés en mémoire courte
follow_up_seconds = 8.0     # fenêtre du mode suivi, sans redire « Lily » (étape 3)
announce_new_skills = true  # annonce vocale des compétences nouvellement chargées

[plugins]
# Les plugins vivent à la racine du dépôt, pas dans le paquet installé.
# Ajoutez vos propres dossiers ici : ils sont fouillés dans l'ordre, un dossier
# ultérieur masquant un même nom de fichier.
paths = ["./plugins", "~/.lily/plugins"]
timeout = 10.0              # délai par défaut d'un skill, en secondes
# Marge ajoutée au délai pour @skill(isolate=True), le temps que l'interpréteur
# enfant démarre. Montez-la si un Pi lent voit ses compétences isolées tuées
# avant d'avoir commencé.
isolate_startup_s = 3.0
quarantine_after = 3        # échecs consécutifs avant désactivation d'un skill
data_dir = "~/.lily/data"
hot_reload = true           # surveillance du dossier (étape 4)
debounce_ms = 500

[memoire]
# Ce que Lily garde entre deux démarrages : l'historique des conversations
# (reprenables) et les faits durables qu'elle sait de vous. Un fichier SQLite,
# sur votre machine, qui n'en sort jamais.
active = true
fichier = "~/.lily/memoire.sqlite"
messages_repris = 12        # tours rechargés quand on reprend une conversation
reprendre_au_demarrage = false   # true = enchaîner sur la dernière conversation

[apprentissage]
# Ce que Lily retient de VOUS, sans jamais réentraîner un modèle : des
# tables et des compteurs, dans le même fichier SQLite que la mémoire.
active = true
routage = true          # retenir vos formulations : elle route mieux avec le temps
corrections = true      # « non, je voulais dire… » désapprend ET réapprend
vocabulaire = true      # souffler vos noms propres à Whisper
phrases_par_competence = 12
mots_vocabulaire = 40

[corpus]
# Le corpus d'éveil : les deux secondes de son qui précèdent chaque
# déclenchement de « Lily », gardées pour réentraîner le modèle sur VOTRE
# voix — et surtout sur vos faux déclenchements, qui ne s'inventent pas en
# studio. Voir tools/entrainer_lily.py.
#
# ÉTEINT PAR DÉFAUT, et ce n'est pas un oubli : écrire du son sur un disque
# est une décision qui vous appartient. Allumé, seule la fenêtre du mot
# d'éveil est gardée — jamais ce que vous dites ensuite.
actif = false
dossier = "~/.lily/corpus"
secondes_avant = 1.6
secondes_apres = 0.4
maximum_par_classe = 300   # au-delà, les plus anciens extraits sont effacés

[catalogue]
# Les signatures de VOS fonctions, montrées au modèle avant qu'il écrive du
# code. Le mode d'échec numéro un d'un petit modèle sur un dépôt qu'il ne
# connaît pas n'est pas la syntaxe, c'est l'INVENTION D'API : il écrit
# `normalize_weights()`, qui n'existe pas. Donnez-lui la signature, il ne
# peut plus l'inventer de travers.
#
# Lu par AST, jamais par import : aucun effet de bord, et pas besoin que les
# dépendances du dépôt soient installées.
active = true
# racine = "~/projets/CalculRisque_Mark5"   # à défaut, le premier dossier de l'atelier
entrees_rendues = 15    # combien de signatures au plus dans le contexte
caracteres_max = 3000   # et leur taille totale : un 7B ne digère pas tout le dépôt
privees = false         # true = inclure les fonctions commençant par _
tests = false           # true = inclure les tests (ils captent les recherches pour rien)

[connaissances]
# Ce qu'elle a lu : vos documents indexés, et vos tours de conversation. La
# recherche se fait par le SENS, pas par les mots — « combien on a perdu au
# premier trimestre » retrouve « la perte de Q1 s'élève à ».
#
# Les vecteurs vivent dans le même fichier SQLite que la mémoire. Aucune base
# vectorielle à installer, aucun service à tenir en vie.
active = true
engine = "auto"         # auto (Ollama s'il est là) | ollama | llamacpp | hachage | aucun
model = "nomic-embed-text"       # 274 Mo : ollama pull nomic-embed-text
host = "http://127.0.0.1:11434"  # bouclage obligatoire, comme pour le dialogue
# model_path = "~/.lily/models/nomic-embed-text-v1.5.Q4_K_M.gguf"  # engine = "llamacpp"
taille_fragment = 900   # caractères par fragment indexé
recouvrement = 150      # pour qu'une réponse à cheval sur deux fragments survive
passages_rendus = 5     # combien de passages sont montrés au modèle
indexer_les_conversations = true   # chaque tour rejoint l'index, en tâche de fond
fragments_max = 50000   # au-delà, le balayage traîne : elle le dit au lieu de ralentir

[atelier]
# Les dossiers que Lily a le droit de lire et d'écrire.
#
# VIDE PAR DÉFAUT, et ce n'est pas un oubli : la commande arrive par la voix,
# une transcription est imparfaite, et un modèle choisit parfois mal ses
# arguments. Les compétences « fichiers », « python » et « projet » restent
# donc inertes tant que vous n'ouvrez pas explicitement un dossier.
racines = []
# racines = ["~/projets", "~/Documents/notes"]
lecture_seule = false       # true = elle lit et n'écrit jamais
taille_max_ko = 512         # au-delà, elle refuse de lire un fichier d'un bloc
corbeille = "~/.lily/corbeille"   # rien n'est supprimé, tout y est déplacé

[llm]
engine = "ollama"           # ollama | llamacpp | mock
model = "qwen2.5:7b-instruct-q4_K_M"
host = "http://127.0.0.1:11434"
temperature = 0.3
num_ctx = 4096
keep_alive = "10m"
timeout = 60.0
# Pour engine = "llamacpp" :
# model_path = "models/qwen2.5-7b-instruct-q4_k_m.gguf"
# n_gpu_layers = 35

[llm.router]
direct_threshold = 0.72     # au-dessus, l'étage déterministe décide seul
shortlist_threshold = 0.35  # en-dessous, l'outil n'est même pas proposé au modèle
shortlist_size = 5
number_extraction = true    # « à vingt faces » -> faces=20, sans solliciter le modèle
# Quand le score dépasse direct_threshold mais que les arguments ne se
# devinent pas — « note que je dois appeler Paul » —, ne demander au modèle
# QUE les arguments, pas le choix de l'outil. Un appel au lieu de deux, pour
# la moitié des compétences. Passez à false pour rendre au modèle son droit
# de veto sur le choix de l'outil.
sauter_la_selection = true

[stt]
engine = "faster-whisper"   # faster-whisper | vosk | scripted
model = "small"             # tiny | base | small | medium | large-v3
device = "auto"             # auto | cpu | cuda
compute_type = "auto"       # auto | int8 | int8_float16 | float16 | float32
language = "fr"
beam_size = 5
cpu_threads = 0             # 0 = laisser CTranslate2 décider
models_dir = "models/whisper"
# Whisper invente des phrases sur du silence. On ne l'appelle même pas
# en dessous de ce niveau sonore, et on écarte les formules connues.
min_rms = 0.006
min_duration_s = 0.25
drop_hallucinations = true
vad_filter = false          # le VAD du pipeline s'en charge (étape 3)
# Amorce le vocabulaire : sans elle, « Lily » devient « Lili », « lilas » ou « il y a ».
initial_prompt = "Lily, assistante vocale. Minuteur, notes, météo, volume, heure."

[tts]
engine = "piper"            # piper | silent
voice = "fr_FR-siwis-medium"
models_dir = "models/piper"
speed = 1.0                 # > 1 = plus rapide
volume = 1.0

[wake]
# openwakeword | vosk | scripted. Il n'existe pas de modèle pré-entraîné pour
# « lily » : tant qu'il n'est pas entraîné (tools/entrainer_lily.py),
# le repli Vosk à grammaire restreinte prend automatiquement le relais.
engine = "openwakeword"
word = "lily"
threshold = 0.5
models_dir = "models/wake"
inference_framework = "onnx"   # onnxruntime s'installe partout, tflite non
debounce_s = 2.0               # silence après déclenchement, pour ne pas re-détecter
vosk_model_path = "models/vosk/vosk-model-small-fr-0.22"
variants = ["lily", "lili", "ma lily"]

[vad]
engine = "silero"           # silero | energie | scripted
threshold = 0.5
min_speech_ms = 200         # parole soutenue avant de considérer qu'un énoncé commence
silence_ms = 700            # silence avant de conclure qu'il est terminé
pre_roll_ms = 300           # audio conservé AVANT la détection, sinon on perd la 1re syllabe
max_utterance_s = 20.0
max_wait_s = 8.0            # après l'éveil, délai avant d'abandonner si personne ne parle
min_total_speech_ms = 300   # en dessous, c'est un bruit, pas une phrase
models_dir = "models/silero"

[barge_in]
# Ce qui autorise l'utilisateur à couper la parole à Lily.
#   voix  : toute parole soutenue l'interrompt (défaut)
#   eveil : seul « Lily » l'interrompt — beaucoup plus sûr sur haut-parleur,
#           où le micro entend la réponse en cours
#   off   : elle finit toujours sa phrase
mode = "voix"
threshold = 0.85            # plus haut que l'écoute normale, à cause de l'écho
min_speech_ms = 300
guard_ms = 400              # on ignore le tout début de la réponse

[audio]
sample_rate = 16000
frame_ms = 30
wake_beep = true            # petit signal à l'éveil, plus rapide qu'un « oui ? » synthétisé
input_device = ""           # vide = périphérique par défaut
output_device = ""

[logging]
level = "INFO"
json = false
