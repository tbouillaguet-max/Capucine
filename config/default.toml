# Configuration de référence de Capucine.
# Elle est chargée en premier, puis surchargée par le profil (pc.toml ou
# pi.toml), puis par les variables d'environnement CAPUCINE_SECTION__CLE,
# puis par les options de ligne de commande.

language = "fr"

[assistant]
name = "Capucine"
persona_file = "config/persona.txt"
memory_turns = 6            # nombre de tours conservés en mémoire courte
follow_up_seconds = 8.0     # fenêtre du mode suivi, sans redire « Capucine » (étape 3)
announce_new_skills = true  # annonce vocale des compétences nouvellement chargées

[plugins]
# Les plugins vivent à la racine du dépôt, pas dans le paquet installé.
# Ajoutez vos propres dossiers ici : ils sont fouillés dans l'ordre, un dossier
# ultérieur masquant un même nom de fichier.
paths = ["./plugins", "~/.capucine/plugins"]
timeout = 10.0              # délai par défaut d'un skill, en secondes
# Marge ajoutée au délai pour @skill(isolate=True), le temps que l'interpréteur
# enfant démarre. Montez-la si un Pi lent voit ses compétences isolées tuées
# avant d'avoir commencé.
isolate_startup_s = 3.0
quarantine_after = 3        # échecs consécutifs avant désactivation d'un skill
data_dir = "~/.capucine/data"
hot_reload = true           # surveillance du dossier (étape 4)
debounce_ms = 500

[llm]
engine = "ollama"           # ollama | llamacpp | mock
model = "qwen2.5:7b-instruct-q4_K_M"
host = "http://127.0.0.1:11434"
temperature = 0.3
num_ctx = 4096
keep_alive = "10m"
timeout = 60.0
# Pour engine = "llamacpp" :
# model_path = "models/qwen2.5-7b-instruct-q4_k_m.gguf"
# n_gpu_layers = 35

[llm.router]
direct_threshold = 0.72     # au-dessus, l'étage déterministe décide seul
shortlist_threshold = 0.35  # en-dessous, l'outil n'est même pas proposé au modèle
shortlist_size = 5
number_extraction = true    # « à vingt faces » -> faces=20, sans solliciter le modèle

[stt]
engine = "faster-whisper"   # faster-whisper | vosk | scripted
model = "small"             # tiny | base | small | medium | large-v3
device = "auto"             # auto | cpu | cuda
compute_type = "auto"       # auto | int8 | int8_float16 | float16 | float32
language = "fr"
beam_size = 5
cpu_threads = 0             # 0 = laisser CTranslate2 décider
models_dir = "models/whisper"
# Whisper invente des phrases sur du silence. On ne l'appelle même pas
# en dessous de ce niveau sonore, et on écarte les formules connues.
min_rms = 0.006
min_duration_s = 0.25
drop_hallucinations = true
vad_filter = false          # le VAD du pipeline s'en charge (étape 3)
# Amorce le vocabulaire : sans elle, « Capucine » devient « capucin » ou « ca pue ».
initial_prompt = "Capucine, assistante vocale. Minuteur, notes, météo, volume, heure."

[tts]
engine = "piper"            # piper | silent
voice = "fr_FR-siwis-medium"
models_dir = "models/piper"
speed = 1.0                 # > 1 = plus rapide
volume = 1.0

[wake]
# openwakeword | vosk | scripted. Il n'existe pas de modèle pré-entraîné pour
# « capucine » : tant qu'il n'est pas entraîné (tools/entrainer_capucine.py),
# le repli Vosk à grammaire restreinte prend automatiquement le relais.
engine = "openwakeword"
word = "capucine"
threshold = 0.5
models_dir = "models/wake"
inference_framework = "onnx"   # onnxruntime s'installe partout, tflite non
debounce_s = 2.0               # silence après déclenchement, pour ne pas re-détecter
vosk_model_path = "models/vosk/vosk-model-small-fr-0.22"
variants = ["capucine", "capucin", "ma capucine"]

[vad]
engine = "silero"           # silero | energie | scripted
threshold = 0.5
min_speech_ms = 200         # parole soutenue avant de considérer qu'un énoncé commence
silence_ms = 700            # silence avant de conclure qu'il est terminé
pre_roll_ms = 300           # audio conservé AVANT la détection, sinon on perd la 1re syllabe
max_utterance_s = 20.0
max_wait_s = 8.0            # après l'éveil, délai avant d'abandonner si personne ne parle
min_total_speech_ms = 300   # en dessous, c'est un bruit, pas une phrase
models_dir = "models/silero"

[barge_in]
# Ce qui autorise l'utilisateur à couper la parole à Capucine.
#   voix  : toute parole soutenue l'interrompt (défaut)
#   eveil : seul « Capucine » l'interrompt — beaucoup plus sûr sur haut-parleur,
#           où le micro entend la réponse en cours
#   off   : elle finit toujours sa phrase
mode = "voix"
threshold = 0.85            # plus haut que l'écoute normale, à cause de l'écho
min_speech_ms = 300
guard_ms = 400              # on ignore le tout début de la réponse

[audio]
sample_rate = 16000
frame_ms = 30
wake_beep = true            # petit signal à l'éveil, plus rapide qu'un « oui ? » synthétisé
input_device = ""           # vide = périphérique par défaut
output_device = ""

[logging]
level = "INFO"
json = false
